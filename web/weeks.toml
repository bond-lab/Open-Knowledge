# The timetable.  make_dates.py turns this into slides/dates.tex, so every
# date in the slides and handouts comes from here.
year = 2026

# Deadlines that are not class dates.  "MM-DD" uses the year above;
# "YYYY-MM-DD" says which year (the final paper is due after New Year).
[deadlines]
task = "10-11"          # three paragraphs on water use (due before the sources session)
reviews = "12-15"       # peer reviews posted in the forum
final = "2027-01-15"    # paper and Wikipedia article

# Francis's sessions are 90 minutes (16:45-18:15): some students cannot stay
# later, so each of his former three-hour classes is now two weekly sessions.
# Pavel's remain three hours, with the new content in the first 90 minutes.
#
# Czech public holidays falling on a Tuesday in the 2026 autumn semester:
#   11-17 Struggle for Freedom and Democracy Day (Den boje za svobodu a demokracii)
# Nothing is scheduled that week; the FAIR/CARE pair sits before it, which is
# why Pavel's "good article" session moved to 11-10.
# (09-28 St Wenceslas and 10-28 Czechoslovak Statehood fall on Mon/Wed in 2026.)

# Weeks with no class.  These are shown in the timetable so the gaps are
# explained rather than mysterious; they have no page of their own.
[[breaks]]
key = "reading"
date = "10-20"
title = "Reading and writing week"
other = "No class: work on your topic and sources"

[[breaks]]
key = "holiday"
date = "11-17"
title = "Public holiday: Den boje za svobodu a demokracii"
other = "No class: Struggle for Freedom and Democracy Day"

[[breaks]]
key = "writingweeks"
date = "12-22"
title = "Reading and writing weeks"
other = "No class until the deadline: revise your paper and your article"

